  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1c1c1e;
      --border-color: rgba(255, 255, 255, 0.15);
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
      --accent-yellow: #FFF201;
    }
    
/* 메인 아웃라인 버튼 커스텀 (보라색 강제 제거 및 테두리/호버 추가) */
md-outlined-button {
  width: 100%;
  
  /* 버튼 기본 형태 */
  --md-outlined-button-container-shape: 8px;
  --md-outlined-button-container-height: 46px;
  
  /* [기본 상태] 글자색 흰색, 테두리 반투명 흰색 */
  --md-outlined-button-label-text-color: #ffffff;
  --md-outlined-button-outline-color: rgba(255, 255, 255, 0.15);
  
  /* [호버 상태] 글자색 흰색 유지, 테두리 더 밝게 */
  --md-outlined-button-hover-label-text-color: #ffffff;
  --md-outlined-button-hover-outline-color: rgba(255, 255, 255, 0.6);
  
  /* [포커스/클릭 상태] 보라색으로 튀는 현상 방지 */
  --md-outlined-button-focus-label-text-color: #ffffff;
  --md-outlined-button-focus-outline-color: rgba(255, 255, 255, 0.6);
  --md-outlined-button-pressed-label-text-color: #ffffff;
  --md-outlined-button-pressed-outline-color: rgba(255, 255, 255, 0.4);
  
  /* 버튼 내부 호버 시 감도는 기본 보라색 투명 오버레이를 흰색으로 변경 */
  --md-outlined-button-hover-state-layer-color: rgba(255, 255, 255, 0.05);
  --md-outlined-button-focus-state-layer-color: rgba(255, 255, 255, 0.1);
  --md-outlined-button-pressed-state-layer-color: rgba(255, 255, 255, 0.1);

  transition: all 0.2s ease;
}

/* 마우스 올렸을 때 버튼 전체 배경에 아주 미세하게 불 들어오는 효과 */
md-outlined-button:hover {
  background-color: rgba(255, 255, 255, 0.03);
}


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Roboto', 'NanumGothicBold', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .profile-box {
      width: 100%;
      max-width: 360px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
    }

    .profile {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-color);
      margin-bottom: 15px;
    }

    .txt {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .social-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: transparent;
      color: var(--text-color);
      text-decoration: none;
      transition: all 0.2s ease; 
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .icon-btn:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background-color: rgba(255, 255, 255, 0.05); 
    }

    .button-group {
      margin-bottom: 25px;
    }

    md-outlined-button {
      width: 100%;
      --md-outlined-button-container-shape: 8px;
      --md-outlined-button-container-height: 46px;
      --md-outlined-button-outline-color: var(--border-color);
      --md-outlined-button-label-text-color: var(--text-color);
      transition: all 0.2s ease;
    }

    md-outlined-button:hover {
      --md-outlined-button-outline-color: rgba(255, 255, 255, 0.6);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .donate-box {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .donate-title {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .bank-info {
      font-size: 0.9rem;
    }

    .banks {
      color: var(--accent-yellow);
      text-decoration: none;
      font-weight: bold;
    }

    @font-face {
      font-family: 'NanumGothicBold';
      src: url('fonts.ttf') format('truetype');
    }
  </style>
</head>
